name: R tests

# Runs the existing testthat suite (83 files / ~11.3k lines under
# ArthOMix/tests/testthat/) on every push/PR to main. The app root
# (global.R/server.R/ui.R/renv.lock/DESCRIPTION) is the ArthOMix/ subfolder
# of this repo, not the repo root - every step below sets
# working-directory: ArthOMix accordingly. Test invocation mirrors
# ArthOMix/tests/testthat.R's own documented command:
#   Rscript -e 'testthat::test_dir("tests/testthat")'
# run from the ArthOMix app root.
#
# NOTE: this workflow has not been run against a live GitHub Actions job -
# it has not been executed/verified end-to-end here. It follows the
# standard, well-established r-lib/actions setup-r + setup-renv pattern and
## is syntactically valid YAML, but should be watched on its first real run
# in case any package in renv.lock needs an additional system library not
# listed below.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RENV_PATHS_ROOT: ~/.local/share/renv
      # Non-secret placeholders so R/auth/auth_api.R's
      # SUPABASE_URL/SUPABASE_ANON_KEY module-level reads don't error out;
      # tests/testthat/test-auth-functions.R deliberately covers only pure
      # logic and never performs a real Supabase network call, so these
      # values never need to be real credentials.
      SUPABASE_URL: ""
      SUPABASE_ANON_KEY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This app's DESCRIPTION lists a large, Bioconductor-heavy dependency
      # set (see ArthOMix/DESCRIPTION Imports) - these are the common
      # compiled-from-source system libraries that stack tends to need.
      # This is a starting point, not an exhaustive list: a first real run
      # of this workflow may surface additional -dev packages required by
      # specific Bioconductor packages in renv.lock.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            pandoc \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libblas-dev \
            liblapack-dev \
            gfortran

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Set up renv + restore ArthOMix/renv.lock
        uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: ArthOMix

      - name: Run testthat suite
        working-directory: ArthOMix
        run: Rscript -e 'testthat::test_dir("tests/testthat")'
