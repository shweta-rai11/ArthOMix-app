name: R tests

# Runs the existing testthat suite (83 files / ~11.3k lines under
# ArthOMix/tests/testthat/) on every push/PR to main. The app root
# (global.R/server.R/ui.R/renv.lock/DESCRIPTION) is the ArthOMix/ subfolder
# of this repo, not the repo root - every step below sets
# working-directory: ArthOMix accordingly. Test invocation mirrors
# ArthOMix/tests/testthat.R's own documented command:
#   Rscript -e 'testthat::test_dir("tests/testthat")'
# run from the ArthOMix app root.
#
# NOTE: this workflow has not been run against a live GitHub Actions job -
# it has not been executed/verified end-to-end here. It follows the
# standard, well-established r-lib/actions setup-r + setup-renv pattern and
## is syntactically valid YAML, but should be watched on its first real run
# in case any package in renv.lock needs an additional system library not
# listed below.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A from-scratch renv::restore() compiles ~95 direct (many more
    # transitive) Bioconductor/CRAN packages from source with no cache yet
    # to draw from - confirmed live: still steadily progressing with zero
    # errors at the original 60-minute cutoff, several minutes per package
    # for the larger methylation/annotation packages (Gviz, lumi,
    # wateRmelon, etc.). actions/cache (via r-lib/actions/setup-renv)
    # should make subsequent runs much faster once a cache exists.
    timeout-minutes: 180
    env:
      RENV_PATHS_ROOT: ~/.local/share/renv
      # renv.lock pins several GitHub-only packages (ggtree/ieugwasr/
      # MCPcounter/MRPRESSO/TwoSampleMR). Every dependent package's remote
      # gets re-resolved against api.github.com, which quickly exceeds the
      # unauthenticated 60 requests/hour limit (confirmed live) and fails
      # the whole restore with "[error code 22]". GITHUB_TOKEN is provided
      # automatically by Actions for every run - no secret to configure -
      # and renv/remotes read GITHUB_PAT to authenticate those calls,
      # raising the limit to 5000/hour.
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Non-secret placeholders so R/auth/auth_api.R's
      # SUPABASE_URL/SUPABASE_ANON_KEY module-level reads don't error out;
      # tests/testthat/test-auth-functions.R deliberately covers only pure
      # logic and never performs a real Supabase network call, so these
      # values never need to be real credentials.
      SUPABASE_URL: ""
      SUPABASE_ANON_KEY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This app's DESCRIPTION lists a large, Bioconductor-heavy dependency
      # set (see ArthOMix/DESCRIPTION Imports) - these are the common
      # compiled-from-source system libraries that stack tends to need.
      # This is a starting point, not an exhaustive list: a first real run
      # of this workflow may surface additional -dev packages required by
      # specific Bioconductor packages in renv.lock.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            pandoc \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libblas-dev \
            liblapack-dev \
            gfortran \
            libmagick++-dev \
            libglpk-dev \
            libglu1-mesa-dev \
            libgl1-mesa-dev \
            freeglut3-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      # renv's own parallel graph installer has a reproducible bug for this
      # one package specifically: "Failed to prepare 'MCPcounter': target
      # file '.../MCPcounter' already exists" (confirmed live, twice,
      # deterministic - not a timeout/parallelism artifact, since renv's
      # "prepare" step runs sequentially in the controller process, not in
      # a worker). MCPcounter is the only one of this lockfile's 6
      # GitHub-sourced packages that needs RemoteSubdir (its R package
      # lives in a Source/ subfolder, not the repo root - see its own
      # README's install instructions) - the other 5 (no subdir) all
      # install cleanly, pointing at renv's subdir-remote handling
      # specifically. Pre-installing it via the independent `remotes`
      # package - a different GitHub-install code path entirely - before
      # renv::restore() runs means restore() finds it already present and
      # matching the lockfile record, and never touches the buggy path.
      - name: Pre-install MCPcounter (works around a renv subdir-remote bug)
        working-directory: ArthOMix
        run: |
          if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv")
          renv::activate()
          ## Confirmed live: install.packages()/remotes just use the first
          ## writable .libPaths() entry, which is R_LIBS_USER (a generic
          ## runner temp dir set by an earlier step) - NOT the renv project
          ## library - regardless of renv::activate() having run. Target
          ## the project library explicitly so restore() actually finds
          ## this package where it looks for it.
          lib <- renv::paths$library()
          dir.create(lib, recursive = TRUE, showWarnings = FALSE)
          .libPaths(c(lib, .libPaths()))
          if (!requireNamespace("remotes", quietly = TRUE)) install.packages("remotes", lib = lib)
          ## ref must be "master" (not the pinned SHA) - renv.lock's own
          ## MCPcounter record has RemoteRef "master", and confirmed live:
          ## renv compares the installed package's own recorded RemoteRef
          ## against the lockfile's, not just RemoteSha - installing with
          ## the SHA as ref records that SHA as RemoteRef instead, which
          ## renv then treats as a mismatch needing reinstall (right back
          ## into the same buggy path this step exists to avoid). master
          ## currently resolves to the exact same commit either way.
          remotes::install_github(
            "ebecht/MCPcounter", subdir = "Source",
            ref = "master",
            upgrade = "never", lib = lib
          )
        shell: Rscript {0}
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up renv + restore ArthOMix/renv.lock
        uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: ArthOMix

      # testthat/shinytest2/chromote are correctly listed under DESCRIPTION's
      # Suggests: (test-only, not real app runtime deps) - renv.lock only
      # snapshots the app's own dependency graph, so they were never in it
      # to restore. Installed here, into the same renv project library
      # renv::restore() just populated, rather than added to the lockfile.
      - name: Install test-only packages (testthat/shinytest2/chromote)
        working-directory: ArthOMix
        run: |
          renv::activate()
          renv::install(c("testthat", "shinytest2", "chromote"), prompt = FALSE)
        shell: Rscript {0}

      - name: Run testthat suite
        working-directory: ArthOMix
        run: |
          renv::activate()
          testthat::set_max_fails(Inf)
          testthat::test_dir("tests/testthat")
        shell: Rscript {0}
