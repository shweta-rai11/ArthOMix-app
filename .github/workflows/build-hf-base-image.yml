name: Build Hugging Face base image

# Builds the R-package base image the Hugging Face Space starts from and pushes it to
# GHCR. Needed because the Space builder's time limit is shorter than a full renv restore.
on:
  workflow_dispatch:
  push:
    paths:
      - "ArthOMix/renv.lock"
      - "ArthOMix/deploy/huggingface/Dockerfile.base"
      - ".github/workflows/build-hf-base-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # Minimal build context: only the lockfile and the Dockerfile (never the 4 GB data tree).
      - name: Prepare build context
        run: |
          mkdir -p "$RUNNER_TEMP/ctx"
          cp ArthOMix/renv.lock "$RUNNER_TEMP/ctx/renv.lock"
          cp ArthOMix/deploy/huggingface/Dockerfile.base "$RUNNER_TEMP/ctx/Dockerfile"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/ctx
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/shweta-rai11/arthomix-base:r4.4.2
            ghcr.io/shweta-rai11/arthomix-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
